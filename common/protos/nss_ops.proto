syntax = "proto3";

package nss_ops;

import "google/protobuf/empty.proto";

enum Command {
  Invalid = 0;
  Handshake = 1;  // Reserved for RPC handshake
  // Application-specific commands start from 16
  PutInode = 16;
  GetInode = 17;
  ListInodes = 18;
  DeleteInode = 19;
  CreateRootInode = 20;
  DeleteRootInode = 21;
  Rename = 22;
  PutInodeCas = 23;
  // Batched inode mutations: process N entries in one RPC, return per-
  // entry results. Each entry is either a PutInode (or PutInodeCas) or a
  // SetAttr op. Cross-batch ordering uses depends_on_index for the
  // mkdir-then-creat patterns the writeback queue collapses.
  InodeBatch = 24;
  // Single RPC that probes both the file-form key (/foo) and the
  // directory-form key (/foo/) server-side and returns whichever
  // exists -- or NotFound. Eliminates the two sequential GetInode
  // round trips fs_server otherwise issues for every FUSE_LOOKUP.
  GetInodeAny = 25;
}

// PutInode
message PutInodeRequest {
  string root_blob_name = 1;
  string key = 2;
  bytes value = 3;
}

message PutInodeResponse {
  oneof result {
    bytes ok = 1;
    google.protobuf.Empty err_no_such_root_blob = 2;
    string err_other = 3;
  }
}

// PutInodeCas: byte-equality compare-and-swap on the stored value.
//
// expected_old_value carries the bytes the caller believes are currently
// stored at `key`. The server proceeds with the put only when the current
// value matches byte-for-byte. The empty string requires that no live
// entry exists for `key`.
message PutInodeCasRequest {
  string root_blob_name = 1;
  string key = 2;
  bytes value = 3;
  bytes expected_old_value = 4;
}

message PutInodeCasResponse {
  oneof result {
    bytes ok = 1;        // success: returns previous value bytes (may be empty)
    bytes conflict = 2;  // CAS failure: returns currently stored value bytes
    string err = 3;
  }
}

// GetInode
message GetInodeRequest {
  string root_blob_name = 1;
  string key = 2;
}

message GetInodeResponse {
  oneof result {
    bytes ok = 1;
    google.protobuf.Empty err_not_found = 2;
    google.protobuf.Empty err_no_such_root_blob = 3;
    string err_other = 4;
  }
}

// GetInodeAny: probe both the file-form (/foo) and the directory-form
// (/foo/) keys in one RPC. Caller passes the bare path with NO trailing
// slash; NSS internally appends both forms. Response disambiguates
// which form (if any) was found.
message GetInodeAnyRequest {
  string root_blob_name = 1;
  string key = 2;
}

message GetInodeAnyResponse {
  oneof result {
    Hit file = 1;            // matched the file-form key (/foo)
    Hit directory = 2;       // matched the directory-form key (/foo/)
    google.protobuf.Empty err_not_found = 3;
    google.protobuf.Empty err_no_such_root_blob = 4;
    string err_other = 5;
  }
  message Hit {
    bytes value = 1;
  }
}

// ListInodes
message ListInodesRequest {
  string root_blob_name = 1;
  uint32 max_keys = 2;
  string prefix = 3;
  string delimiter = 4;
  string start_after = 5;
  bool skip_mpu_parts = 6;
}

message ListInodesResponse {
  oneof result {
    Inodes ok = 1;
    google.protobuf.Empty err_no_such_root_blob = 2;
    string err_other = 3;
  }

  message Inode {
    string key = 1;
    bytes inode = 2;
  }

  message Inodes {
    repeated Inode inodes = 1;
    bool has_more = 2;
  }
}

// DeleteInode
message DeleteInodeRequest {
  string root_blob_name = 1;
  string key = 2;
}

message DeleteInodeResponse {
  oneof result {
    bytes ok = 1;
    google.protobuf.Empty err_not_found = 2;
    google.protobuf.Empty err_already_deleted = 3;
    google.protobuf.Empty err_no_such_root_blob = 4;
    string err_other = 5;
  }
}

// CreateRootInode
// in case of az mirroring, also needs to create internal tracking tree
message CreateRootInodeRequest {
  string bucket = 1;
  bool az_mirroring = 2;
}

message CreateRootInodeResponse {
  message Blobs {
    string root_blob_name = 1;
    string tracking_root_blob_name = 2;
  }

  oneof result {
    Blobs ok = 1;
    string err = 2;
  }
}

// DeleteRootInode
message DeleteRootInodeRequest {
  string root_blob_name = 1;
}

message DeleteRootInodeResponse {
  oneof result {
    string ok = 1;
    google.protobuf.Empty err_not_empty = 2;
    string err_other = 3;
  }
}

// Rename
message RenameRequest {
  string root_blob_name = 1;
  string src_path = 2;
  string dst_path = 3;
  // Only honored for rename-object (paths ending with \0). When true and the
  // destination already exists, the rename overwrites it and the old dst value
  // is returned in RenameResponse.ok.
  bool force_overwrite = 4;
}

message RenameResponse {
  oneof result {
    bytes ok = 1;
    google.protobuf.Empty err_src_nonexisted = 2;
    google.protobuf.Empty err_dst_existed = 3;
    google.protobuf.Empty err_no_such_root_blob = 4;
    string err_other = 5;
  }
}

// InodeBatch: process N inode mutations in one RPC. Entries run in
// order; each entry's result is reported individually so an isolated
// CAS conflict on one entry does not roll back the rest.
//
// Initial scope only enables PutInodeBatchEntry and SetAttrBatchEntry
// (matching the Phase 1 writeback-queue intent set). Other op kinds
// (unlink / rmdir / rename / link / symlink / mknod / commit-claim)
// can land later without a schema break -- the entry oneof holds
// reserved tags for them.
message InodeBatchRequest {
  string root_blob_name = 1;
  repeated InodeBatchEntry entries = 2;
}

message InodeBatchEntry {
  oneof op {
    PutInodeBatchEntry put = 1;
    SetAttrBatchEntry  setattr = 2;
    // Reserved tags 3..10 for: unlink / rmdir / rename_file /
    // rename_dir / link / symlink / mknod / commit_claim. Adding any
    // of these is a backward-compatible schema extension.
  }
  // Indices of preceding entries in this batch that must succeed
  // before this entry runs. Empty for independent entries. The
  // handler reports DEPENDENCY_FAILED on dependents whose listed
  // predecessor did not return OK; the writeback retry path
  // group-requeues the failed predecessor with all its dependents.
  repeated uint32 depends_on_index = 11;
}

// Single Put. `cas_check=true` enforces that the bytes currently at
// `key` match `expected_old_value` (CAS); `cas_check=false` is the
// unconditional put. Mirrors today's `PutInode` / `PutInodeCas` split
// inside one entry shape so the writeback worker can pick per-entry.
message PutInodeBatchEntry {
  string key = 1;
  bytes value = 2;
  bool cas_check = 3;
  bytes expected_old_value = 4;
}

message SetAttrBatchEntry {
  string key = 1;
  bytes attrs = 2;
  bool cas_check = 3;
  bytes expected_old_value = 4;
}

message InodeBatchResponse {
  repeated InodeEntryResult results = 1;
}

message InodeEntryResult {
  BatchEntryStatus status = 1;
  // Populated on CAS_CONFLICT: the bytes the server actually has.
  bytes current_value = 2;
  string error_message = 3;
}

enum BatchEntryStatus {
  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  STATUS_CAS_CONFLICT = 2;
  STATUS_PERMANENT_ERROR = 3;
  STATUS_TRANSIENT = 4;
  STATUS_DEPENDENCY_FAILED = 5;
}
