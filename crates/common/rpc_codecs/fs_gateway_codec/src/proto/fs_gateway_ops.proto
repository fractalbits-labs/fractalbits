syntax = "proto3";

package fs_gateway_ops;

import "google/protobuf/empty.proto";

// The client addresses data by inode key and logical block number only.
// Blob identity, block generations, the `@ovr/` row map and reclamation
// are owned by the gateway; the client never names a blob or a version.

enum Command {
  Invalid = 0;
  Handshake = 1;

  // Session
  Mount = 2;

  // Inode primitives
  GetInode = 3;
  ListInodes = 4;
  PutInode = 5;
  PutInodeCas = 6;
  DeleteInode = 7;
  RenameFile = 8;
  RenameFolder = 9;
  PutDirMarker = 10;
  ListMpuParts = 11;

  // Data primitives, addressed by (key, logical block)
  ReadBlock = 12;
  ProbeDataBlocks = 13;
  BeginFlush = 14;
  WriteFlushBlock = 15;
  CommitFlush = 16;
  AbortFlush = 17;

  // Gateway-side cache hint
  PrefetchInode = 18;
}

// Backend outcomes VfsCore distinguishes. Kept as an enum (not errno) so
// the client's retry and CAS-rebase logic keeps working over the wire.
enum ErrorKind {
  Internal = 0;
  NotFound = 1;
  AlreadyExists = 2;
  CasConflict = 3;
  NoSpace = 4;
  // Write-once key addressed with different bytes.
  Mismatch = 5;
  BlockNotFound = 6;
  Corrupted = 7;
  InvalidState = 8;
  Unauthorized = 9;
  ReadOnly = 10;
  Deserialize = 11;
  // The layout at the key no longer matches the version the client
  // read against; refresh the layout and retry.
  StaleLayout = 12;
}

message Error {
  ErrorKind kind = 1;
  string message = 2;
}

// Session token issued by Mount, carried by every other request.
message Caller {
  bytes token = 1;
}

// ---------- Mount ----------

message MountRequest {
  string bucket = 1;
  bool read_write = 2;
  string api_key_id = 3;
  uint64 timestamp_ms = 4;
  bytes nonce = 5;
  // HMAC-SHA256(secret_key, key_id | bucket | prefix | holder | timestamp_ms | nonce)
  bytes signature = 6;
  // Random per mounting process, stable across its re-mounts. Orphan
  // keys are tagged with it so a later writer mount can reclaim those
  // of a process that is gone without touching its own.
  bytes instance = 7;
  // Directory key the session is confined to; "/" or empty for the
  // whole bucket. Must start and end with "/".
  string prefix = 8;
}

message MountResponse {
  oneof result {
    Session ok = 1;
    Error err = 2;
  }

  message Session {
    bytes token = 1;
    bool supports_s3_volume = 2;
  }
}

// ---------- Inode primitives ----------

message GetInodeRequest {
  Caller caller = 1;
  string key = 2;
}

message GetInodeResponse {
  oneof result {
    bytes ok = 1;
    Error err = 2;
  }
}

message ListInodesRequest {
  Caller caller = 1;
  string prefix = 2;
  string delimiter = 3;
  string start_after = 4;
  uint32 max_keys = 5;
}

message ListInodesResponse {
  oneof result {
    Page ok = 1;
    Error err = 2;
  }

  message Entry {
    string key = 1;
    // Empty for a common prefix (directory).
    bytes value = 2;
  }

  message Page {
    repeated Entry entries = 1;
    bool has_more = 2;
  }
}

// A client-supplied inode value may carry a data binding (blob, ceiling,
// size, map epoch) only when it copies one the bucket already stores:
// the value it replaces under CAS, or, for a blind put, the value at
// `proof_key` (hardlink promotion copies the source layout into its
// shared record). Only the gateway's flush commit changes a binding.
message PutInodeRequest {
  Caller caller = 1;
  string key = 2;
  bytes value = 3;
  string proof_key = 4;
}

message PutInodeResponse {
  oneof result {
    // Previous bytes (empty if new).
    bytes ok = 1;
    Error err = 2;
  }
}

message PutInodeCasRequest {
  Caller caller = 1;
  string key = 2;
  bytes value = 3;
  bytes expected_old_value = 4;
}

message PutInodeCasResponse {
  oneof result {
    bytes ok = 1;
    Error err = 2;
  }
}

// `teardown` reclaims the data the removed value named, after the reader
// grace. `orphan` instead moves a data-bearing value to a hidden
// `@orphan/` key so still-open handles keep a name to address it by; the
// client deletes that key with `teardown` on the last close.
message DeleteInodeRequest {
  Caller caller = 1;
  string key = 2;
  bool teardown = 3;
  bool orphan = 4;
}

message DeleteInodeResponse {
  oneof result {
    Deleted ok = 1;
    Error err = 2;
  }

  message Deleted {
    bool existed = 1;
    bytes previous = 2;
    // Set when the value was moved instead of deleted.
    string orphan_key = 3;
  }
}

message RenameFileRequest {
  Caller caller = 1;
  string src_key = 2;
  string dst_key = 3;
  bool force_overwrite = 4;
  // As for DeleteInode, applied to the value the rename displaced.
  bool teardown_displaced = 5;
  bool orphan_displaced = 6;
}

message RenameFileResponse {
  oneof result {
    Displaced ok = 1;
    Error err = 2;
  }

  message Displaced {
    // Prior destination bytes (empty if none).
    bytes previous = 1;
    string orphan_key = 2;
  }
}

message RenameFolderRequest {
  Caller caller = 1;
  string src_key = 2;
  string dst_key = 3;
}

message RenameFolderResponse {
  oneof result {
    google.protobuf.Empty ok = 1;
    Error err = 2;
  }
}

message PutDirMarkerRequest {
  Caller caller = 1;
  string key = 2;
}

message PutDirMarkerResponse {
  oneof result {
    google.protobuf.Empty ok = 1;
    Error err = 2;
  }
}

message ListMpuPartsRequest {
  Caller caller = 1;
  string key = 2;
  bytes upload_id = 3;
}

message ListMpuPartsResponse {
  oneof result {
    Parts ok = 1;
    Error err = 2;
  }

  message Part {
    string key = 1;
    bytes layout = 2;
  }

  message Parts {
    repeated Part parts = 1;
  }
}

// ---------- Data primitives ----------

// One logical block of the file published at `key`, at its committed
// content. `expected_version_id` (16 bytes, optional) is the layout the
// client read against: a different committed layout answers StaleLayout
// so one read never straddles two commits.
message ReadBlockRequest {
  Caller caller = 1;
  string key = 2;
  uint32 block_number = 3;
  bytes expected_version_id = 4;
}

message ReadBlockResponse {
  oneof result {
    Block ok = 1;
    Error err = 2;
  }

  message Block {
    // Empty with `hole == true` for a block that reads as zeros.
    bytes data = 1;
    bool hole = 2;
  }
}

// Which blocks of `[first_block, first_block + block_count)` hold data
// (lseek SEEK_DATA / SEEK_HOLE). Absent blocks are holes.
message ProbeDataBlocksRequest {
  Caller caller = 1;
  string key = 2;
  uint32 first_block = 3;
  uint32 block_count = 4;
  bytes expected_version_id = 5;
}

message ProbeDataBlocksResponse {
  oneof result {
    Blocks ok = 1;
    Error err = 2;
  }

  message Blocks {
    repeated uint32 data_blocks = 1;
  }
}

// A flush publishes one handle's dirty blocks and size to `key` in three
// steps: BeginFlush prepares (mints the blob for a create, or burns the
// next generation and records append territory), WriteFlushBlock ships
// bodies concurrently, CommitFlush stages rows and advances the ceiling.
// The ticket is signed gateway state: every step is self-contained.
message BeginFlushRequest {
  Caller caller = 1;
  // Publish key: the name, or its `@hardlink/` record for a promoted
  // inode, or the `@orphan/` key of an unlinked open file.
  string key = 2;
  // The committed layout this flush was buffered against (empty for a
  // create). A stored layout whose committed data differs is a conflict.
  bytes expected_layout = 3;
  uint64 file_size = 4;
  // Blocks the flush will rewrite and blocks it punches to zeros.
  repeated uint32 rewrites = 5;
  repeated uint32 punched = 6;
  optional uint32 eof_low_watermark = 7;
  optional uint32 trim_upper = 8;
}

message BeginFlushResponse {
  oneof result {
    Prepared ok = 1;
    Error err = 2;
  }

  message Prepared {
    bytes ticket = 1;
    // The prepared layout now stored at the key (empty for a create),
    // so a retry after a mid-flush failure buffers against it.
    bytes layout = 2;
  }
}

message WriteFlushBlockRequest {
  Caller caller = 1;
  bytes ticket = 2;
  uint32 block_number = 3;
  bytes data = 4;
}

message WriteFlushBlockResponse {
  oneof result {
    google.protobuf.Empty ok = 1;
    Error err = 2;
  }
}

message PosixAttrs {
  uint32 mode = 1;
  uint32 uid = 2;
  uint32 gid = 3;
  uint64 mtime_ns = 4;
  uint64 ctime_ns = 5;
}

message CommitFlushRequest {
  Caller caller = 1;
  bytes ticket = 2;
  // Same sets BeginFlush saw; every rewrite has been acknowledged.
  repeated uint32 rewrites = 3;
  repeated uint32 punched = 4;
  // Attributes for a create; an overwrite carries the stored ones forward.
  PosixAttrs posix = 5;
}

message CommitFlushResponse {
  oneof result {
    // The committed layout (bare, even when stored inside a record).
    bytes ok = 1;
    Error err = 2;
  }
}

message AbortFlushRequest {
  Caller caller = 1;
  bytes ticket = 2;
}

message AbortFlushResponse {
  oneof result {
    google.protobuf.Empty ok = 1;
    Error err = 2;
  }
}

// Signed by the gateway, opaque to the client.
message FlushTicket {
  string bucket = 1;
  string key = 2;
  bytes blob_id = 3;
  uint32 volume_id = 4;
  bool create = 5;
  uint64 version = 6;
  uint64 base_ceiling = 7;
  uint64 base_epoch = 8;
  uint64 committed_size = 9;
  uint64 file_size = 10;
  uint32 block_size = 11;
  optional uint32 abandoned_lo = 12;
  optional uint32 abandoned_hi = 13;
  optional uint32 eof_low_watermark = 14;
  optional uint32 trim_upper = 15;
  uint64 issued_ms = 16;
}

// ---------- Hints ----------

// Best-effort whole-file warm of the gateway disk cache.
message PrefetchInodeRequest {
  Caller caller = 1;
  string key = 2;
}

message PrefetchInodeResponse {
  oneof result {
    google.protobuf.Empty ok = 1;
    Error err = 2;
  }
}
