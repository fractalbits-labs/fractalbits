[package]
name = "fractal-vfs"
version = "0.1.0"
edition = "2024"
description = "The fractalbits client-side VFS: inode table + writeback cache over the fs_gateway protocol, used by the FUSE/NFS/etc adapters."
license = "Apache-2.0"
repository = "https://github.com/fractalbits-labs/fractalbits-main"

[dependencies]
# Storage backend: the fs_gateway protocol only.
rpc_client_common = { workspace = true, default-features = false, features = ["compio-runtime"] }
rpc_client_fs = { workspace = true, default-features = false, features = ["compio-runtime"] }
fs_gateway_codec.workspace = true
data_types.workspace = true

# Async runtime.
compio-runtime.workspace = true

# Common.
strum.workspace = true
bytes.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
rkyv.workspace = true
moka = { workspace = true, features = ["sync"] }
dashmap.workspace = true
parking_lot.workspace = true
futures.workspace = true
uuid.workspace = true
config.workspace = true
rand.workspace = true
lru.workspace = true
libc.workspace = true

# InodeId / FileHandleId / Errno types shared with the FUSE adapter.
fractal-fuse = { path = "../fs_client/fractal-fuse" }

[dev-dependencies]
compio-macros.workspace = true
